name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The site now lives at https://pragmaticproteindesign.bio.ed.ac.uk/
      # (wells-wood-research/group-website). This publishes redirect/, which
      # sends every page here to the same page there.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
